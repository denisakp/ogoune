# Project identity
sonar.projectKey=ogoune
sonar.projectName=ogoune
sonar.sourceEncoding=UTF-8

# SonarQube server
sonar.host.url=http://localhost:9009/

# Sources and tests (monorepo)
sonar.sources=cmd,internal,pkg,web/src
sonar.tests=internal,pkg,web/src

# Test file patterns
sonar.test.inclusions=**/*_test.go,web/src/**/*.spec.ts,web/src/**/*.test.ts

# Global exclusions (generated/build/vendor)
sonar.exclusions=**/vendor/**,**/node_modules/**,**/web/dist/**,**/docs/**,**/*.pb.go,**/testdata/**,**/dist/**,**/coverage/**

# Optional: exclude non-critical zones from coverage target
sonar.coverage.exclusions=**/vendor/**,**/node_modules/**,**/web/dist/**,**/*.pb.go,**/testdata/**

# Go coverage report
sonar.go.coverage.reportPaths=coverage/unit.out

# Frontend (TS/Vue) coverage report (Vitest/Jest lcov)
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
# Generated code is regenerated, not written: it is not a coverage target and
# its two dialect copies are duplication by construction. Test doubles are
# exercised by the tests that use them, not tested themselves.
sonar.exclusions=internal/repository/sqlc/pg/**,internal/repository/sqlc/sqlite/**,web/packages/api-types/generated/**
sonar.coverage.exclusions=internal/repository/fake/**,**/*_test.go,web/src/**/*.spec.ts,web/src/test/**
sonar.test.inclusions=**/*_test.go,web/src/**/*.spec.ts
sonar.cpd.exclusions=internal/repository/sqlc/pg/**,internal/repository/sqlc/sqlite/**

# "New code" is measured against the previous version, so the version must be
# the latest release tag: pass -Dsonar.projectVersion=$(git tag --sort=-v:refname | head -1)
# (the `make sonar` target does).
